org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------------------
# Kotlin incremental compilation — turn OFF only if your project directory and
# your pub cache live on **different drive letters** (Windows).
#
# Why: Kotlin's incremental compiler insists that every source file it compiles
# shares one filesystem root. When the project sits on one drive and the plugin
# sources come from the pub cache on another (e.g.
#   <pub-cache>/hosted/pub.dev/file_selector_android-.../android/src/.../GeneratedFileSelectorApi.kt
# ), the compiler aborts with:
#   "IllegalArgumentException: this and base files have different roots"
#   -> "Could not close incremental caches in ...\kotlin\compileDebugKotlin\..."
# Setting this to false skips that machinery entirely; the only cost is slower
# Kotlin builds. If everything is on one drive, leave it unset (or true) to get
# incremental builds.
#
# Kept at `false` here: the development checkout has the project on `E:` and the
# pub cache on `C:`. Change it to `true` if your layout differs.
# ---------------------------------------------------------------------------
# kotlin.incremental=false   # 仅当工程目录与 pub 缓存不在同一盘符时才需要（见上）

# ---------------------------------------------------------------------------
# Non-ASCII project path — only needed if the **project path** contains
# non-ASCII characters.
#
# Why: the Android Gradle Plugin refuses to build in that case:
#   "Your project path contains non-ASCII characters. This will most likely
#    cause the build to fail on Windows. Please move the project to a
#    different directory. ... adding the line 'android.overridePathCheck=false'
#    to gradle.properties file in the project directory."
# If your checkout path is pure ASCII (recommended), you can delete this line or
# set it to false. It is harmless to leave on, but it disables a real check.
#
# Recommend `false` (or deleting the line) for a pure-ASCII checkout: leaving it
# on silently disables the plugin's path check, so a genuinely broken path will
# fail later and less clearly. Kept at `true` here so this checkout builds
# regardless of where it is cloned to.
# ---------------------------------------------------------------------------
android.overridePathCheck=false
