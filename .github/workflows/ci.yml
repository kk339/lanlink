name: CI

# 每次有人往仓库提交 / 提 PR，GitHub 自动起一台 Windows 机器：
# 拉代码 → 装 Flutter → 三个纯 Dart 包各跑 analyze + test → app 跑 analyze + 全部测试。
# 全绿说明"这个仓库在别人的机器上真的能跑"，不是作者自己在本地说的。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: 编译 + 全部测试
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter（固定版本，与 README 的「已验证」一致）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: core · analyze + test
        working-directory: core
        run: |
          dart pub get
          dart analyze
          dart test

      - name: store · analyze + test
        working-directory: store
        run: |
          dart pub get
          dart analyze
          dart test

      - name: cli · analyze + test
        working-directory: cli
        run: |
          dart pub get
          dart analyze
          dart test

      - name: app · 拉依赖
        working-directory: app
        run: flutter pub get

      - name: app · 静态检查
        working-directory: app
        run: dart analyze lib test

      - name: app · 全部测试
        working-directory: app
        run: flutter test
